name: Windows support client
on:
  push:
    branches:
      - main
    paths:
      - 'support-session/customer/*.ps1'
      - 'support-session/tests/*.ps1'
      - '.github/workflows/support-windows.yml'
  pull_request:
    paths:
      - 'support-session/customer/*.ps1'
      - 'support-session/tests/*.ps1'
      - '.github/workflows/support-windows.yml'
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned OpenSSH 8.1 authentication fixture
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/v8.1.0.0p1-Beta/OpenSSH-Win64.zip' -OutFile "$env:RUNNER_TEMP/OpenSSH-Win64.zip"
          if ((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/OpenSSH-Win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c99240af89452610f66b7ce54c4fa3180b66aae2bc326afc2aac8fc1dd48f488') { throw 'OpenSSH 8.1 test fixture hash mismatch.' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/OpenSSH-Win64.zip" -DestinationPath "$env:RUNNER_TEMP/OpenSSH-8.1"
      - name: Download pinned OpenSSH 9.8.3 Server 2016 fixture
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/v9.8.3.0p2-Preview/OpenSSH-Win64.zip' -OutFile "$env:RUNNER_TEMP/OpenSSH-Win64-9.8.3.zip"
          if ((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/OpenSSH-Win64-9.8.3.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0ca131f3a78f404dc819a6336606caec0db1663a692ccc3af1e90232706ada54') { throw 'OpenSSH 9.8.3 test fixture hash mismatch.' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/OpenSSH-Win64-9.8.3.zip" -DestinationPath "$env:RUNNER_TEMP/OpenSSH-9.8.3"
      - name: Windows PowerShell 5.1 syntax and lifecycle tests
        shell: powershell
        run: |
          ./support-session/tests/test_windows_client.ps1
          ./support-session/tests/test_windows_lease.ps1
          ./support-session/tests/test_windows_diagnostics.ps1
          ./support-session/tests/test_windows_permissions.ps1
          ./support-session/tests/test_windows_openssh_auth.ps1 -OpenSshDirectory "$env:RUNNER_TEMP/OpenSSH-8.1/OpenSSH-Win64"
          ./support-session/tests/test_windows_openssh_auth.ps1 -OpenSshDirectory "$env:RUNNER_TEMP/OpenSSH-9.8.3/OpenSSH-Win64" -CompatibilityRuntime
