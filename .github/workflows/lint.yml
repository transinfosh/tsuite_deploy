name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.j2"
      - "**/*.ps1"
      - "tests/**"
      - ".shellcheckrc"
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.j2"
      - "**/*.ps1"
      - "tests/**"
      - ".shellcheckrc"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml shellcheck

      - name: Check shell syntax
        run: |
          for script in single-node/deploy.sh install.sh multi-node/tools/create-source-bundle.sh control-node/*.sh control-node/github-egress/*.sh tests/*.sh; do bash -n "$script"; done

      - name: Run ShellCheck
        run: |
          shellcheck single-node/deploy.sh install.sh multi-node/tools/create-source-bundle.sh tests/test_static.sh tests/test_single_node_adopt.sh
          shellcheck --severity=warning control-node/*.sh control-node/github-egress/*.sh

      - name: Run static tests
        run: tests/test_static.sh
