User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 60
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 20
Allow 127.0.0.1
ConnectPort 443
Filter "/etc/tinyproxy/github-domains"
FilterType fnmatch
FilterDefaultDeny Yes
