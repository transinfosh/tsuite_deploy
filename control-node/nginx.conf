server {
	listen 127.0.0.1:8081;
	server_name edge.trinfo.net;

	access_log /var/log/nginx/tsuite-control-access.log;
	error_log /var/log/nginx/tsuite-control-error.log warn;

	location = /_tsuite-control-health {
		default_type text/plain;
		return 200 "tsuite-control-ok\n";
	}

	location ^~ /deploy-files/ {
		alias /srv/tsuite-deploy/files/;
		autoindex off;
		disable_symlinks on;
		add_header Cache-Control "no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
	}

	location ^~ /support/ {
		proxy_pass http://127.0.0.1:8765/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location / {
		return 404;
	}
}
