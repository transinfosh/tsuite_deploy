---
- name: 创建 Phoenix 目录
  ansible.builtin.file:
    path: /opt/tsuite-deploy/phoenix
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: 写入 Phoenix 环境
  ansible.builtin.template:
    src: env.j2
    dest: /opt/tsuite-deploy/phoenix/.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: 写入 Phoenix Compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/tsuite-deploy/phoenix/compose.yml
    owner: root
    group: root
    mode: "0640"

- name: 启动 Phoenix
  ansible.builtin.command: >-
    docker compose --env-file /opt/tsuite-deploy/phoenix/.env
    -p tai-phoenix -f /opt/tsuite-deploy/phoenix/compose.yml up -d
  register: phoenix_up
  changed_when: "'Started' in phoenix_up.stdout or 'Created' in phoenix_up.stderr"
