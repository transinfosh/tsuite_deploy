---
- name: 安装 Docker 与 Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-buildx
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: 校验 Docker 代理参数
  ansible.builtin.assert:
    that:
      - deployment_http_proxy | length == 0 or deployment_http_proxy is match('^https?://[^/]+')
      - deployment_no_proxy | length > 0

- name: 创建 Docker Systemd 配置目录
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 写入 Docker Daemon 代理
  ansible.builtin.template:
    src: http-proxy.conf.j2
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: 重启 Docker

- name: 创建 Root Docker Client 配置目录
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: 写入 Docker Build 与容器代理
  ansible.builtin.template:
    src: config.json.j2
    dest: /root/.docker/config.json
    owner: root
    group: root
    mode: "0600"

- name: 应用 Docker Daemon 代理
  ansible.builtin.meta: flush_handlers

- name: 启用 Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: 读取 Docker Compose 版本
  ansible.builtin.command: docker compose version
  changed_when: false

- name: 读取 Docker Buildx 版本
  ansible.builtin.command: docker buildx version
  changed_when: false

- name: 登录部署镜像仓库
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ deployment_registry }}"
      - --username
      - "{{ deployment_registry_username }}"
      - --password-stdin
    stdin: "{{ deployment_registry_token }}"
    stdin_add_newline: true
  when:
    - image_delivery_mode == 'registry'
    - deployment_registry_username | length > 0
    - deployment_registry_token | length > 0
  changed_when: false
  no_log: true
