---
- name: 等待 TAI Service 就绪
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tai_service_port }}/readyz"
    method: GET
    status_code: 200
  register: tai_service_readiness
  retries: 30
  delay: 2
  until: tai_service_readiness.status == 200
  changed_when: false

- name: 初始化 TAI Service 运行时模型策略
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - tai-tai-service-service-1
      - python
      - -c
      - |
        import json
        from pathlib import Path
        from urllib.request import Request, urlopen

        token = Path("/run/secrets/tai_service_token").read_text(encoding="utf-8").strip()
        headers = {"Authorization": f"Bearer {token}"}
        base_url = "http://127.0.0.1:{{ tai_service_port }}/v1/runtime/config/model-configuration"
        current = json.loads(urlopen(Request(base_url, headers=headers), timeout=15).read())
        existing = current.get("policy") if isinstance(current, dict) else None
        policy = {
            "kind": "model_configuration",
            "chat": {
                "provider_key": "openai",
                "model_key": "deepseek-v4-flash",
                "thinking_mode": "disabled",
                "thinking_effort": "default",
            },
            "intent_router": {"enabled": False},
            "embedding": {
                "enabled": True,
                "provider_key": {{ embedding_provider_key | to_json }},
                "model_key": {{ embedding_model | to_json }},
                "timeout_seconds": {{ embedding_timeout_seconds }},
                "dimensions": {{ embedding_dimensions }},
                "backfill_batch_size": {{ embedding_backfill_batch_size }},
                "similarity_threshold": 0.3,
            },
        }
        comparable_existing = (
            {key: existing.get(key) for key in policy}
            if isinstance(existing, dict)
            else None
        )
        if comparable_existing == policy:
            print("runtime model configuration already initialized")
        else:
            payload = json.dumps({
                "expected_version": current["version"],
                "policy": policy,
                "actor": "ansible-bootstrap",
            }).encode("utf-8")
            request = Request(
                base_url,
                data=payload,
                headers={**headers, "Content-Type": "application/json"},
                method="PUT",
            )
            urlopen(request, timeout=15).read()
            print("runtime model configuration synchronized")
  register: tai_service_runtime_model_bootstrap
  changed_when: "'synchronized' in tai_service_runtime_model_bootstrap.stdout"
  no_log: true
